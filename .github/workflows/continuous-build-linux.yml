name: "Continuous build (Linux)"

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'continuous*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            host: x86_64-linux-gnu
            pkgarch: amd64
            dependencies: g++-multilib meson nasm wget wine64-tools yasm

          - os: ubuntu-24.04
            arch: i686
            host: i386-linux-gnu
            pkgarch: i386
            dependencies: g++-multilib meson nasm wget wine32-tools yasm

          - os: ubuntu-24.04
            arch: armhf
            host: arm-linux-gnueabihf
            pkgarch: armhf
            dependencies: g++-arm-linux-gnueabihf meson nasm qemu-user-static wget yasm

          - os: ubuntu-24.04
            arch: aarch64
            host: aarch64-linux-gnu
            pkgarch: arm64
            dependencies: g++-aarch64-linux-gnu meson nasm qemu-user-static wget yasm

          - os: ubuntu-24.04
            arch: riscv64
            host: riscv64-linux-gnu
            pkgarch: riscv64
            dependencies: g++-riscv64-linux-gnu meson nasm qemu-user-static wget yasm

          - os: ubuntu-24.04
            arch: ppc64el
            host: powerpc64le-linux-gnu
            pkgarch: ppc64el
            dependencies: g++-powerpc64le-linux-gnu meson nasm qemu-user-static wget yasm

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Add architectures
        run: |
          if [ ${{ matrix.arch }} = x86_64 ]; then
            sudo dpkg --add-architecture i386
          else
            sudo dpkg --add-architecture ${{ matrix.pkgarch }}
          fi

      - name: Prepare sources
        if: ${{ matrix.arch != 'i686' && matrix.arch != 'x86_64' }}
        run: |
          printf '%s\n' "Types: deb" "URIs: http://ports.ubuntu.com/ubuntu-ports" "Suites: noble noble-updates noble-security" "Components: main restricted universe" "Architectures: ${{ matrix.pkgarch }}" | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources > /dev/null
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then sudo sed -i '/^Types:/a Architectures: amd64 i386' /etc/apt/sources.list.d/ubuntu.sources; fi
          if [ -f /etc/apt/sources.list ]; then sudo sed -i 's/^deb \(http\|mirror\)/deb [arch=amd64,i386] \1/' /etc/apt/sources.list; fi

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.dependencies }}
          sudo apt install -y adwaita-icon-theme gnome-icon-theme libasound2-dev:${{ matrix.pkgarch }} libdecor-0-dev:${{ matrix.pkgarch }} libdecor-0-plugin-1-cairo:${{ matrix.pkgarch }} libdecor-0-plugin-1-gtk:${{ matrix.pkgarch }} libgdk-pixbuf-2.0-dev:${{ matrix.pkgarch }} libgtk-3-dev:${{ matrix.pkgarch }} liblzma-dev:${{ matrix.pkgarch }} libpulse-dev:${{ matrix.pkgarch }} libssl-dev:${{ matrix.pkgarch }} libudev-dev:${{ matrix.pkgarch }} libwayland-dev:${{ matrix.pkgarch }} libxkbcommon-dev:${{ matrix.pkgarch }} libzstd-dev:${{ matrix.pkgarch }} wayland-protocols

      - name: Prepare toolchain
        if: ${{ matrix.arch != 'i686' && matrix.arch != 'x86_64' }}
        run: |
          sudo rm -f /usr/bin/gcc /usr/bin/g++ /usr/bin/cpp /usr/bin/ld /usr/bin/strip
          sudo ln -s ${{ matrix.host }}-gcc /usr/bin/gcc
          sudo ln -s ${{ matrix.host }}-g++ /usr/bin/g++
          sudo ln -s ${{ matrix.host }}-cpp /usr/bin/cpp
          sudo ln -s ${{ matrix.host }}-ld /usr/bin/ld
          sudo ln -s ${{ matrix.host }}-strip /usr/bin/strip

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build codecs
        env:
          AppImageArch: ${{ matrix.arch }}
        run: |
          .github/workflows/tools/build-codecs

      - name: Build AppImage
        env:
          AppImageArch: ${{ matrix.arch }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          .github/workflows/tools/build-appimage
